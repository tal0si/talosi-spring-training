spring:
  application:
    name: spring
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:5432/${DATABASE_NAME:superfight}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true

server:
  port: 9090

apikey: apikeytochange
